[__config__]
oldver = "upstream-old.json"
newver = "upstream-new.json"
max_concurrency = 8
http_timeout = 30

# Proprietary binary without a machine-readable release feed.
["app-benchmarks/unigine-superposition"]
source = "manual"
manual = "1.1"
policy = "manual"
note = "Check the vendor download page manually during the monthly audit."

# GitHub tags are unrelated tagNNNNN snapshots. The official page exposes the
# actual HBMAME release number.
["app-emulation/hbmame"]
source = "regex"
url = "https://hbmame.1emulation.com/"
regex = 'HBMAME ([0-9]+\.[0-9]+\.[0-9]+) \(64-bit, cmd-line\)'
policy = "manual"
note = "Verify the MAME compatibility level before bumping."

# The upstream repository is unavailable and SRC_URI is a local archive.
["app-emulation/linuxmameui"]
source = "manual"
manual = "0.1.0"
policy = "manual"
note = "A portable bump needs a public source archive or a restored repository."

["app-emulation/mame"]
source = "github"
github = "mamedev/mame"
use_latest_release = true
from_pattern = '^mame0([0-9]+)$'
to_pattern = '0.\1'
policy = "review"

["app-emulation/mameuix"]
source = "github"
github = "firesand/MAMEUIx"
use_latest_release = true
prefix = "v"
policy = "review"
note = "Regenerate and review the large Cargo dependency list."

["app-emulation/winboat"]
source = "github"
github = "winboat-org/winboat"
use_latest_release = true
prefix = "v"
policy = "review"
note = "Binary repack of the upstream x64 tarball; refresh both the tag and the release asset."

# The vendor publishes no release feed, but its APT index is machine-readable.
["app-misc/chatgpt-desktop"]
source = "regex"
url = "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages"
regex = 'Version: ([0-9][0-9.]*)'
policy = "review"
note = "Confirm the arm64 index reports the same version, then refresh both distfiles."

["app-misc/unsloth-desktop"]
source = "github"
github = "unslothai/unsloth"
use_latest_release = true
from_pattern = '^v([0-9.]+)-beta$'
to_pattern = '\1_beta'
policy = "review"
note = "Beta releases land several times a day, and the numbering appends digits (0.1.70 then 0.1.701); confirm the new tag really sorts newer before bumping."

["app-portage/equery-gui"]
source = "github"
github = "firesand/equery-gui"
use_max_tag = true
include_regex = '^v[0-9]+(?:\.[0-9]+)*$'
prefix = "v"
policy = "review"

["app-text/markitdown"]
source = "pypi"
pypi = "markitdown"
policy = "review"
note = "Review every optional format dependency and supported Python target."

["app-text/md2hd"]
source = "npm"
npm = "md2hd"
policy = "review"
note = "Upstream cuts no git tags or GitHub releases, so npm is the only versioned feed."

# The workflow image is immutable by digest, so Dependabot cannot infer its
# package version. This signal prompts a manual digest refresh.
["ci/pkgcheck-image"]
source = "pypi"
pypi = "pkgcheck"
policy = "manual"
note = "Resolve and verify the new GHCR digest before changing the QA workflow image."

["dev-python/cobble"]
source = "pypi"
pypi = "cobble"
policy = "review"

["dev-python/magika"]
source = "pypi"
pypi = "magika"
policy = "review"
note = "MarkItDown 0.1.6 requires Magika below 0.7; retain the old ebuild if needed."

["dev-python/mammoth"]
source = "pypi"
pypi = "mammoth"
policy = "review"
note = "MarkItDown 0.1.6 requires Mammoth below 1.12; retain the old ebuild if needed."

["dev-python/pdfplumber"]
source = "pypi"
pypi = "pdfplumber"
policy = "review"

["dev-python/pystray"]
source = "pypi"
pypi = "pystray"
policy = "review"

["dev-python/python-pptx"]
source = "pypi"
pypi = "python-pptx"
policy = "review"

["dev-python/upnpclient"]
source = "pypi"
pypi = "upnpclient"
policy = "review"

["gui-apps/elephant"]
source = "github"
github = "abenz1267/elephant"
use_latest_release = true
prefix = "v"
policy = "review"
group = "walker-stack"
note = "Update with Walker and use the Elephant revision pinned by Walker, not merely the newest tag."

["gui-apps/walker"]
source = "github"
github = "abenz1267/walker"
use_latest_release = true
prefix = "v"
policy = "review"
group = "walker-stack"
note = "Update with Elephant; regenerate Cargo sources and recheck downstream patches."

["media-gfx/opencadstudio"]
source = "github"
github = "HakanSeven12/OpenCADStudio"
use_latest_release = true
prefix = "v"
policy = "review"
note = "Versioned ebuild pins EGIT_COMMIT to the tag; smoke-test cargo vendoring after bumps."

# Every release so far is a prerelease, so GitHub's "latest release" resolves
# nothing; widen the patterns when upstream cuts a stable tag.
["media-video/wolfcut"]
source = "github"
github = "jub0t/Concat"
use_max_tag = true
include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'
from_pattern = '^v([0-9.]+)-alpha\.([0-9]+)$'
to_pattern = '\1_alpha\2'
policy = "review"
note = "Alpha releases reuse one asset filename; refresh the deb, the notices file, and both Manifest entries together."

["net-analyzer/bettercap"]
source = "github"
github = "bettercap/bettercap"
use_latest_release = true
prefix = "v"
policy = "review"
note = "Audit the Go module list, downstream patch, and pinned caplets revision."

# Nested snapshot pinned independently by the Bettercap ebuild.
["net-analyzer/bettercap::caplets"]
source = "github"
github = "bettercap/caplets"
branch = "master"
policy = "snapshot"
note = "Review caplet changes before moving the pinned commit."

["net-misc/fluxcast"]
source = "pypi"
pypi = "fluxcast"
policy = "review"
note = "Rebase the overlay patches and test UPnP discovery."

# Snapshot packages deliberately use full UTC commit timestamps so multiple
# commits on the same day cannot be hidden.
["net-wireless/bully"]
source = "github"
github = "kimocoder/bully"
branch = "master"
policy = "snapshot"
note = "Do not replace the pinned snapshot without reviewing post-release fixes."

["net-wireless/hcxdumptool"]
source = "github"
github = "ZerBea/hcxdumptool"
use_latest_release = true
policy = "review"
group = "hcx-suite"
note = "Bump together with hcxtools when their release versions are paired."

["net-wireless/hcxtools"]
source = "github"
github = "ZerBea/hcxtools"
use_latest_release = true
policy = "review"
group = "hcx-suite"
note = "Bump together with hcxdumptool when their release versions are paired."

["net-wireless/mdk4"]
source = "github"
github = "aircrack-ng/mdk4"
branch = "master"
policy = "snapshot"
note = "The snapshot is intentional; review compiler fixes before moving it."

["net-wireless/pixiewps"]
source = "github"
github = "wiire-a/pixiewps"
use_latest_release = true
prefix = "v"
policy = "review"

["net-wireless/wiflux"]
source = "github"
github = "Leadrogue/Wiflux"
use_latest_release = true
prefix = "v"
policy = "review"
note = "Rebase and test every downstream patch before accepting a bump."

["sys-firmware/ds5dongle"]
source = "github"
github = "awalol/DS5Dongle"
use_latest_release = true
prefix = "v"
from_pattern = '^v([0-9]+\.[0-9]+\.[0-9]+)(?:-hotfix)?$'
to_pattern = '\1'
policy = "review"
note = "Release tags may use a -hotfix suffix; keep MY_PV aligned with the published tag and refresh SRC_URI assets."

# Live-only packages have no version bump; smoke-build their HEAD manually.
["sys-power/asusctl"]
source = "manual"
manual = "9999"
policy = "live"

["sys-power/supergfxctl"]
source = "manual"
manual = "9999"
policy = "live"
